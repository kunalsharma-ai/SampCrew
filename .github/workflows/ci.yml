name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Shared rate-limit counters (apps/api/test/rate-limits.spec.ts runs two API instances against it).
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_MONGODB_URL: mongodb://localhost:27017/crew_test?replicaSet=rs0
      REDIS_TEST_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm typecheck
      # A replica set, because SampCrew relies on multi-document transactions.
      - name: Start MongoDB replica set
        run: infra/ci/start-mongo.sh
      - run: pnpm test
      - name: Data-layer engine tests
        run: pnpm test:mongo
      - name: Outlook signature test kit builds
        run: pnpm signature:test-kit
      - name: Build apps
        run: pnpm --filter @crew/api --filter @crew/web --filter @crew/console run build
        env:
          CREW_API_URL: http://localhost:4000
      - name: OpenAPI spec is up to date
        run: |
          cd apps/api && node dist/openapi-export.js > /tmp/openapi.json
          diff -q /tmp/openapi.json ../../docs/api/openapi.json || (echo "Run: pnpm --filter @crew/api build && pnpm --filter @crew/api openapi" && exit 1)
        env:
          MONGODB_URL: mongodb://unused:27017/crew
          JWT_ACCESS_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-access
          JWT_PLATFORM_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-platform
          FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  e2e:
    # Drives the real Web Portal, the mobile app's browser build and the Super Admin Console in Chromium against a seeded database.
    runs-on: ubuntu-latest
    needs: test
    # Throwaway values for a disposable CI database; nothing here is used outside this job.
    env:
      CREW_ENV: local
      MONGODB_URL: mongodb://localhost:27017/crew?replicaSet=rs0
      WEB_PUBLIC_URL: http://localhost:3000
      CREW_API_URL: http://localhost:4000
      SESSION_COOKIE_SECURE: "false"
      JWT_ACCESS_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-access
      JWT_PLATFORM_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-platform
      FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CREW_BOOTSTRAP_ADMIN_EMAIL: admin@sampledge.ci
      CREW_BOOTSTRAP_ADMIN_PASSWORD: Ci-Only-Console-Admin-1!
      CREW_SEED_DEMO: "true"
      CREW_DEMO_PASSWORD: Ci-Only-Demo-Users-1!
      # The mobile app's browser build is served on 8081 by e2e/mobile-flow.cjs.
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:8081
      EXPO_PUBLIC_CREW_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start MongoDB replica set
        run: infra/ci/start-mongo.sh
      - run: pnpm build
      - name: Build the mobile app for the browser
        run: pnpm --filter @crew/mobile export:web
      - name: Web Portal and mobile app end-to-end flows
        run: |
          pnpm db:reset
          node apps/api/dist/main.js > api.log 2>&1 &
          pnpm --filter @crew/web start > web.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4000/api/v1/health/ready http-get://localhost:3000/login
          pnpm e2e:session
          pnpm e2e:web
          pnpm e2e:hr
          pnpm e2e:directory
          pnpm e2e:setup
          pnpm e2e:signature
          pnpm e2e:bids
          pnpm e2e:universe
          pnpm e2e:talent
          pnpm e2e:helpdesk
          pnpm e2e:attendance
          pnpm e2e:payroll
          pnpm e2e:mobile
          pnpm e2e:experience
          pnpm e2e:neon
          pnpm e2e:recruitment
          pnpm e2e:ats
          pnpm e2e:iq
      - name: AI features end-to-end flow (local AI test stub, no real model)
        # e2e/ai-stub.cjs stands in for the Claude Messages API with fixed answers; the key is a dummy value.
        run: |
          pkill -f "dist/main.js" || true
          pnpm db:reset
          node e2e/ai-stub.cjs > stub.log 2>&1 &
          AI_PROVIDER=anthropic ANTHROPIC_API_KEY=ci-test-key-not-a-real-key ANTHROPIC_BASE_URL=http://localhost:4010 node apps/api/dist/main.js > api.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4000/api/v1/health/ready http-get://localhost:3000/login http-get://localhost:4010/__requests
          pnpm e2e:ai
      - name: Integrations end-to-end flow (local Slack test stub and webhook receiver)
        # The flow runs its own receivers on 4020 (stands in for hooks.slack.com) and 4021; no real Slack is called.
        run: |
          pkill -f "dist/main.js" || true
          pnpm db:reset
          INTEGRATIONS_ALLOW_PRIVATE_URLS=true SLACK_WEBHOOK_BASE_URL=http://localhost:4020 node apps/api/dist/main.js > api.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4000/api/v1/health/ready http-get://localhost:3000/login
          pnpm e2e:integrations
      - name: Enterprise end-to-end flow (local OIDC test stub, no real identity provider)
        # e2e/oidc-stub.cjs runs inside the flow on 4030 and stands in for an identity provider; its issuer is a
        # loopback http address, which the API only accepts with INTEGRATIONS_ALLOW_PRIVATE_URLS (refused outside local and test).
        run: |
          pkill -f "dist/main.js" || true
          pnpm db:reset
          INTEGRATIONS_ALLOW_PRIVATE_URLS=true node apps/api/dist/main.js > api.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4000/api/v1/health/ready http-get://localhost:3000/login
          pnpm e2e:enterprise
      - name: Phase 11 end-to-end flow (local SAML test stub, no real identity provider)
        # e2e/saml-stub.cjs runs inside the flow on 4031 and stands in for a SAML identity provider; the mobile app's
        # browser build is served on 8081 and its /sso address is allowed to receive single sign-on for this run.
        run: |
          pkill -f "dist/main.js" || true
          pnpm db:reset
          INTEGRATIONS_ALLOW_PRIVATE_URLS=true MOBILE_SSO_REDIRECTS=crew://sso,http://localhost:8081/sso node apps/api/dist/main.js > api.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4000/api/v1/health/ready http-get://localhost:3000/login
          pnpm e2e:hardening
      - name: Backup and restore drill
        # mongodump and mongorestore come from the mongo:8.0 container that runs the database, so they always match
        # the server; the archive is streamed through stdin and stdout.
        run: |
          mkdir -p "$RUNNER_TEMP/mongo-tools"
          for t in mongodump mongorestore; do
            printf '#!/bin/sh\nexec docker exec -i mongo %s "$@"\n' "$t" > "$RUNNER_TEMP/mongo-tools/$t"
          done
          chmod +x "$RUNNER_TEMP/mongo-tools/"*
          MONGO_TOOLS="$RUNNER_TEMP/mongo-tools" pnpm --filter @crew/db dr-drill
      - name: Super Admin Console smoke test
        run: |
          pkill -f "dist/main.js" || true
          pnpm db:reset
          node apps/api/dist/main.js > api.log 2>&1 &
          pnpm --filter @crew/console start > console.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4000/api/v1/health/ready http-get://localhost:3001/login
          pnpm e2e:console
      - name: Workspace access controls (console switches, web portal enforcement)
        # Needs a console admin without MFA, so it runs on a fresh database; Web Portal and Console are still running.
        run: |
          pkill -f "dist/main.js" || true
          pnpm db:reset
          node apps/api/dist/main.js > api.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4000/api/v1/health/ready http-get://localhost:3000/login http-get://localhost:3001/login
          pnpm e2e:access
      - name: Plans decide features (Console plan builder, Web Portal gating, Enterprise request)
        # Enrols console admin and owner MFA, so it needs a fresh database.
        run: |
          pkill -f "dist/main.js" || true
          pnpm db:reset
          node apps/api/dist/main.js > api.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4000/api/v1/health/ready http-get://localhost:3000/login http-get://localhost:3001/login
          pnpm e2e:plans
      - name: Platform integrations from the Console (local Claude API stub and SMTP server, no env changes)
        # The flow runs its own stand-ins on 4040 (Claude Messages API) and 4041 (SMTP). The API starts with no AI or
        # SMTP settings at all: everything is set up from Console > Integrations. Needs a console admin and owner without MFA.
        run: |
          pkill -f "dist/main.js" || true
          pnpm db:reset
          node apps/api/dist/main.js > api.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4000/api/v1/health/ready http-get://localhost:3000/login http-get://localhost:3001/login
          pnpm e2e:platform-integrations
      - name: Billing with online payment (local Razorpay stand-in, keys typed into the Console)
        # The flow starts e2e/payments-stub.cjs on 4060 itself; no real Razorpay keys, money or network are used.
        # Needs a console admin and owner without MFA, so it runs on a fresh database.
        run: |
          pkill -f "dist/main.js" || true
          pnpm db:reset
          node apps/api/dist/main.js > api.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4000/api/v1/health/ready http-get://localhost:3000/login http-get://localhost:3001/login
          pnpm e2e:billing
      - name: Super Admin control of workspaces (apps, users, activity, attendance machines, subscription)
        # Needs a console admin without MFA, so it runs on a fresh database; Web Portal and Console are still running.
        run: |
          pkill -f "dist/main.js" || true
          pnpm db:reset
          node apps/api/dist/main.js > api.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4000/api/v1/health/ready http-get://localhost:3000/login http-get://localhost:3001/login
          pnpm e2e:superadmin
      - name: In-app help icons (web, console and mobile; mouse, touch, keyboard, themes)
        # Needs a console admin without MFA, so it runs on a fresh database; the script serves the mobile browser build.
        run: |
          pkill -f "dist/main.js" || true
          pnpm db:reset
          node apps/api/dist/main.js > api.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4000/api/v1/health/ready http-get://localhost:3000/login http-get://localhost:3001/login
          pnpm e2e:help
      - name: Accessibility check (axe-core, WCAG 2.1 A and AA, light and dark)
        # Web Portal and Console are still running from the steps above; the script serves the mobile browser build.
        run: |
          pkill -f "dist/main.js" || true
          pnpm db:reset
          node apps/api/dist/main.js > api.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4000/api/v1/health/ready http-get://localhost:3000/login http-get://localhost:3001/login
          pnpm e2e:a11y
      - name: Workflow load test (overlapping writes must not fail)
        # Shared CI machines vary, so the latency threshold is looser than on a dedicated machine; errors must stay under 1%.
        run: |
          pkill -f "dist/main.js" || true
          pnpm db:reset
          API_RATE_LIMIT_PER_MINUTE=1000000 node apps/api/dist/main.js > api.log 2>&1 &
          npx --yes wait-on@8.0.3 -t 60000 http-get://localhost:4000/api/v1/health/ready
          node e2e/load-workflows.cjs --duration 30 --concurrency 12 --hires 100 --p95 2500
      - name: Server logs
        if: failure()
        run: tail -n 200 api.log web.log console.log stub.log || true

  deploy:
    # Builds the production images and runs infra/deploy/compose.yml as a real stack (TLS proxy, MongoDB, Redis,
    # migration job, backups), then checks it from outside and restores a backup into a new database.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Production stack smoke test
        run: infra/deploy/smoke.sh
      - name: Stack logs
        if: failure()
        run: grep -v -e RouterExplorer -e RoutesResolver infra/deploy/smoke-logs.txt | tail -n 300 || true
  malware-scan:
    # The upload scanning tests (apps/api/test/gaps.spec.ts) against a real ClamAV daemon with current signatures,
    # instead of the protocol stub the "test" job uses. ClamAV downloads its signatures when the container starts.
    runs-on: ubuntu-latest
    needs: test
    env:
      TEST_MONGODB_URL: mongodb://localhost:27017/crew_test?replicaSet=rs0
      CLAMAV_TEST_URL: tcp://127.0.0.1:3310
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Start MongoDB replica set
        run: infra/ci/start-mongo.sh
      - name: Start ClamAV and wait for its signatures
        run: |
          docker run -d --name clamav -p 3310:3310 clamav/clamav:1.4
          for i in $(seq 1 90); do
            if printf 'zPING\0' | timeout 3 nc -q 2 127.0.0.1 3310 2>/dev/null | grep -q PONG; then echo "clamd ready after $((i * 5)) s"; exit 0; fi
            sleep 5
          done
          docker logs clamav | tail -n 50
          exit 1
      - name: Upload scanning against real ClamAV
        run: cd apps/api && npx vitest run test/gaps.spec.ts
      - name: ClamAV logs
        if: failure()
        run: docker logs clamav 2>&1 | tail -n 100 || true
