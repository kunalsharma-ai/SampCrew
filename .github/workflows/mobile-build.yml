# Builds the SampCrew phone app for Android and iOS on Expo's build servers (EAS), and can send it to the stores.
# Run it from Actions > Mobile build. It needs the EXPO_TOKEN repository secret (an Expo access token); store
# signing keys and store logins live in the Expo project, never in this repository. See docs/ops/mobile-builds.md.
name: Mobile build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [all, android, ios]
        default: all
      profile:
        description: preview (installable test build) or production (store build)
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: Send a production build to Google Play (internal testing) and TestFlight when it finishes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check the Expo token
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret (Settings > Secrets and variables > Actions). See docs/ops/mobile-builds.md."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build:packages
        working-directory: .
      - name: Type check and unit tests
        run: pnpm typecheck && pnpm test
      - name: Build on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          npx --yes eas-cli@27.7.2 build --non-interactive --no-wait
          --platform ${{ inputs.platform }} --profile ${{ inputs.profile }}
          ${{ inputs.submit && inputs.profile == 'production' && '--auto-submit' || '' }}
