# ---------------------------------------------------------------------------------------------------------------
# CREW by SAMPLEDGE - Gateway Nginx Configuration
# Reverse proxy routing for Web Portal, Backend API, and Super Admin Console
# ---------------------------------------------------------------------------------------------------------------

# Map for WebSocket support
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Upstream definitions
upstream upstream_web {
    server web:3000;
    keepalive 32;
}

upstream upstream_api {
    server api:4000;
    keepalive 32;
}

upstream upstream_console {
    server console:3001;
    keepalive 32;
}

# ---------------------------------------------------------------------------------------------------------------
# 1. Main Web Portal (e.g. crew.sampledge.com or default)
# ---------------------------------------------------------------------------------------------------------------
server {
    listen 80;
    server_name sampcrew.sampledge.com;

    # Allow up to 12MB uploads (documents, resumes, payroll receipts)
    client_max_body_size 12M;

    # Common proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # WebSockets for Next.js hot reload / live updates
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location / {
        proxy_pass http://upstream_web;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Health check passthrough
    location /healthz {
        proxy_pass http://upstream_web/healthz;
        access_log off;
    }
}

# ---------------------------------------------------------------------------------------------------------------
# 2. Backend REST API (e.g. api.crew.sampledge.com)
# ---------------------------------------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.sampcrew.sampledge.com;

    client_max_body_size 12M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location / {
        proxy_pass http://upstream_api;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /api/v1/health/live {
        proxy_pass http://upstream_api/api/v1/health/live;
        access_log off;
    }
}

# ---------------------------------------------------------------------------------------------------------------
# 3. Super Admin Console (e.g. console.crew.sampledge.com)
# ---------------------------------------------------------------------------------------------------------------
server {
    listen 80;
    server_name console.sampcrew.sampledge.com;

    client_max_body_size 12M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location / {
        proxy_pass http://upstream_console;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /healthz {
        proxy_pass http://upstream_console/healthz;
        access_log off;
    }
}
