# SampCrew production stack on one host: MongoDB (a one-node replica set), Redis, the API, the Web Portal, the Super Admin Console, a TLS
# reverse proxy, daily backups, and a one-shot migration job that runs before the API starts.
#
#   cp env.production.example .env && ./gen-secrets.sh >> .env    # then fill in the addresses and email settings
#   docker compose up -d --build                                    # or pull images you built and pushed
#
# See docs/ops/runbook.md for the full procedure (first start, upgrades, backups, restore, rollback).
# To use MongoDB Atlas or your own replica set instead of the bundled server, set MONGODB_URL (the API's user) and
# MONGODB_ADMIN_URL (migrations and backups) in .env and start without it:  docker compose up -d --scale mongo=0
# (and remove mongo from depends_on below).
name: crew

x-build: &build
  context: ../..
  dockerfile: infra/docker/Dockerfile

x-app-env: &app-env
  CREW_ENV: ${CREW_ENV:-production}
  MONGODB_URL: ${MONGODB_URL:-mongodb://crew_api:${MONGODB_API_PASSWORD}@mongo:27017/crew?replicaSet=rs0&authSource=crew}
  REDIS_URL: redis://:${REDIS_PASSWORD:?run gen-secrets.sh}@redis:6379/0

services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:8.0}
    restart: unless-stopped
    # A one-node replica set (transactions need one) with authentication: the root user is created on the first
    # start, the replica set the first time the health check runs. See scripts/mongo-start.sh.
    entrypoint: ["bash", "/crew/mongo-start.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run gen-secrets.sh}
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?run gen-secrets.sh}
      # mongo:8.0 refuses to start on Linux 6.19+ (SERVER-121912); this lets it run (docker-library/mongo#765).
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
      - ./scripts/mongo-start.sh:/crew/mongo-start.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/crew/mongo-start.sh", "--health"]
      interval: 5s
      retries: 30
      start_period: 30s
    networks: [data]

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    # Only rate-limit counters live here; nothing to keep across restarts.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run gen-secrets.sh}", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data]

  migrate:
    image: ${CREW_IMAGE_PREFIX:-crew}-tools:${CREW_VERSION:-local}
    build: { <<: *build, target: tools }
    restart: "no"
    env_file: .env
    environment:
      <<: *app-env
      # Migrations run as the admin user; they also set the API's own user (MONGODB_API_PASSWORD).
      MONGODB_URL: ${MONGODB_ADMIN_URL:-mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/crew?replicaSet=rs0&authSource=admin}
    depends_on:
      mongo: { condition: service_healthy }
    networks: [data]

  api:
    image: ${CREW_IMAGE_PREFIX:-crew}-api:${CREW_VERSION:-local}
    build: { <<: *build, target: api }
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      API_PORT: "4000"
      STORAGE_DIR: /data/files
      # The API connects as its own crew_api user only; keep the admin password, replica key and backup key out of it.
      MONGO_ROOT_PASSWORD: ""
      MONGODB_ADMIN_URL: ""
      MONGODB_API_PASSWORD: ""
      MONGO_REPLICA_KEY: ""
      BACKUP_PASSPHRASE: ""
    volumes: [files:/data/files]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [data, edge]
    stop_grace_period: 30s

  web:
    image: ${CREW_IMAGE_PREFIX:-crew}-web:${CREW_VERSION:-local}
    build: { <<: *build, target: web }
    restart: unless-stopped
    environment:
      CREW_API_URL: http://api:4000
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL}
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]

  console:
    image: ${CREW_IMAGE_PREFIX:-crew}-console:${CREW_VERSION:-local}
    build: { <<: *build, target: console }
    restart: unless-stopped
    environment:
      CREW_API_URL: http://api:4000
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]

  proxy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CREW_WEB_ADDRESS: ${CREW_WEB_ADDRESS:?set CREW_WEB_ADDRESS}
      CREW_API_ADDRESS: ${CREW_API_ADDRESS:?set CREW_API_ADDRESS}
      CREW_CONSOLE_ADDRESS: ${CREW_CONSOLE_ADDRESS:?set CREW_CONSOLE_ADDRESS}
      CONSOLE_ALLOWED_IPS: ${CONSOLE_ALLOWED_IPS:-private_ranges}
      CREW_TLS_DIRECTIVE: ${CREW_TLS_DIRECTIVE:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Start only once the apps answer their health checks, so the proxy's own first checks find them up.
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
      console: { condition: service_healthy }
    networks: [edge]

  # Virus scanning of uploads (optional): `docker compose --profile scan up -d` and CLAMAV_URL=tcp://clamav:3310 in
  # .env. ClamAV downloads and updates its signatures itself (it needs outbound access to database.clamav.net) and
  # wants about 1.5 GB of memory. While CLAMAV_URL is set and clamd is down, uploads are refused, not stored unscanned.
  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4}
    profiles: [scan]
    restart: unless-stopped
    volumes: [clamav-db:/var/lib/clamav]
    networks: [data]

  backup:
    image: ${CREW_IMAGE_PREFIX:-crew}-tools:${CREW_VERSION:-local}
    restart: unless-stopped
    command: ["/app/infra/deploy/scripts/backup.sh", "--loop"]
    environment:
      MONGODB_URL: ${MONGODB_ADMIN_URL:-mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/crew?replicaSet=rs0&authSource=admin}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - backups:/backups
      - files:/data/files:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [data]

networks:
  # The database and Redis are only on "data"; nothing on the internet-facing side can reach them directly.
  data: {}
  edge: {}

volumes:
  mongodata:
  mongoconfig:
  backups:
  files:
  caddy-data:
  clamav-db:
  caddy-config:
