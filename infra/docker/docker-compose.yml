# Local development services. `docker compose -f infra/docker/docker-compose.yml up -d`
# Redis, MinIO and Mailpit are provisioned now so later phases (queues, documents, email) work locally;
# The API needs MongoDB (and Redis for shared rate limits when several API instances run).
name: crew
services:
  # Single-node replica set: SampCrew needs MongoDB transactions, which a standalone mongod does not offer.
  # The health check initiates the replica set on first start.
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    # Lets mongo:8.0 start on Linux 6.19+ hosts (SERVER-121912); harmless on older kernels.
    environment: { GLIBC_TUNABLES: glibc.pthread.rseq=1 }
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: crew
      MINIO_ROOT_PASSWORD: crew-local-only
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]
volumes:
  mongodata:
  minio:
