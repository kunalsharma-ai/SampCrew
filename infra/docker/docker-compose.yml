# Local development services. `docker compose -f infra/docker/docker-compose.yml up -d`
# Redis, MinIO and Mailpit are provisioned now so later phases (queues, documents, email) work locally;
# Phase 1 code only requires PostgreSQL.
name: crew
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crew
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  # Single-node replica set: SampCrew needs MongoDB transactions, which a standalone mongod does not offer.
  # The health check initiates the replica set on first start.
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: crew
      MINIO_ROOT_PASSWORD: crew-local-only
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
  mongodata:
  minio:
